name: CodeQL

# SAST for a UI component library: XSS vectors in connect functions (innerHTML,
# textContent with unsanitized props), prototype pollution in state machine
# transitions, regex DoS in validation, dangerouslySetInnerHTML misuse.
#
# Not blocking PRs: CodeQL takes 3-8 min. Blocking creates friction without
# equivalent signal — security advisories are raised async via GitHub Advanced
# Security. Runs on push to main + weekly schedule (catches newly published CVEs).
#
# javascript-typescript combined suite: TypeScript-aware queries track types
# through generics, catching type-unsafe patterns the JS-only suite misses.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1"

permissions: read-all

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
